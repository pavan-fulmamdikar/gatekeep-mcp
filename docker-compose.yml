services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slim_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-slim_gatekeep}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slim} -d ${POSTGRES_DB:-slim_gatekeep}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gatekeep-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SLIM_PORT:-8080}:8080"
    environment:
      SLIM_SLACK_SIGNING_SECRET: ${SLIM_SLACK_SIGNING_SECRET:-}
    volumes:
      - ./examples:/examples:ro
      - gateway_data:/data
    command:
      - "--upstream"
      - "${SLIM_UPSTREAM:-https://example-mcp.internal/mcp}"
      - "--pg-dsn"
      - "postgresql://${POSTGRES_USER:-slim}:${POSTGRES_PASSWORD:-slim_dev_password}@postgres:5432/${POSTGRES_DB:-slim_gatekeep}"
      - "--http"
      - "0.0.0.0:8080"
      - "--recovery-interval"
      - "30"
      - "--api-key"
      - "${SLIM_API_KEY:-dev=change_me_before_prod}"

volumes:
  pgdata:
  redisdata:
  gateway_data:
