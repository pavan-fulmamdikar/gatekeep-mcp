# Multi-Replica High-Availability Stack for Gatekeep
#
# Starts:
#   - PostgreSQL 16 (ACID session store, SELECT ... FOR UPDATE CAS, pg_advisory_lock)
#   - Redis 7 (cross-pod SSE Pub/Sub fan-out + optional Redis session store)
#   - gatekeep-pod-a (ASGI uvicorn replica on http://localhost:8081)
#   - gatekeep-pod-b (ASGI uvicorn replica on http://localhost:8082)
#
# Quickstart:
#   docker compose -f docker-compose.ha.yml up -d
#   GATEKEEP_LIVE_PG_DSN=postgresql://gatekeep:gatekeep_dev@localhost:5432/gatekeep \
#   GATEKEEP_LIVE_REDIS_URL=redis://localhost:6379/0 \
#   pytest tests/test_ha_postgres_redis_integration.py -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatekeep
      POSTGRES_PASSWORD: gatekeep_dev
      POSTGRES_DB: gatekeep
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeep -d gatekeep"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  gatekeep-pod-a:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"
    command: >
      sh -c "pip install --no-cache-dir -e '.[all]' &&
      python -m gatekeep --asgi --http 0.0.0.0:8080
      --pg-dsn postgresql://gatekeep:gatekeep_dev@postgres:5432/gatekeep
      --redis-url redis://redis:6379/0
      --api-key acme=dev-ha-secret
      --recovery-interval 15
      --upstream 'python /app/examples/ha_demo_upstream.py'"

  gatekeep-pod-b:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8080"
    command: >
      sh -c "pip install --no-cache-dir -e '.[all]' &&
      python -m gatekeep --asgi --http 0.0.0.0:8080
      --pg-dsn postgresql://gatekeep:gatekeep_dev@postgres:5432/gatekeep
      --redis-url redis://redis:6379/0
      --api-key acme=dev-ha-secret
      --recovery-interval 15
      --upstream 'python /app/examples/ha_demo_upstream.py'"
