name: Gatekeep CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install zero-dependency package and test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest tests/ -v

      - name: Run adversarial security benchmark
        run: python benchmarks/bench_adversarial_security.py

  ha-postgres-redis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gatekeep
          POSTGRES_PASSWORD: gatekeep_dev
          POSTGRES_DB: gatekeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run live multi-replica PostgreSQL 16 + Redis 7 HA soak suite
        env:
          GATEKEEP_LIVE_PG_DSN: postgresql://gatekeep:gatekeep_dev@localhost:5432/gatekeep
          GATEKEEP_LIVE_REDIS_URL: redis://localhost:6379/0
        run: pytest tests/test_ha_postgres_redis_integration.py -v
